name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install CMake
      run: sudo apt-get update && sudo apt-get install -y cmake
      
    - name: Configure
      run: cmake -B build
      
    - name: Build
      run: cmake --build build

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure
      run: cmake -B build
      
    - name: Build
      run: cmake --build build
