version: 1.0.{build}
image: Visual Studio 2019

build:
  verbosity: minimal

before_build:
  - mkdir build
  - cd build
  - cmake .. -G "Visual Studio 16 2019" -DCMAKE_INSTALL_PREFIX=../install

build_script:
  - cmake --build . --config Release

after_build:
  - cmake --build . --target install --config Release

test: off
